name: Publish Docker Image (GHCR)

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'src/PasswordPurgatory/PasswordPurgatory.Web/**'

permissions:
  contents: read
  packages: write

env:
  CSPROJ_PATH: "src/PasswordPurgatory/PasswordPurgatory.Web/PasswordPurgatory.Web.csproj"
  CONTAINER_NAME: "passwordpurgatoryweb"
  CONTAINER_REGISTRY: 'ghcr.io'

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: "🏷️ Generate versioned tag"
      id: tag-creator
      run: |
        buildDay=`date +%Y.%m.%d`
        tags="$buildDay.$GITHUB_RUN_NUMBER"
        echo "VERSION_TAG=$tags" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{env.CONTAINER_REGISTRY}}
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Build and push image to ghcr.io
      run: |
        dotnet publish ${{env.CSPROJ_PATH}} -c Release \
          -p:PublishProfile=DefaultContainer \
          -p:ContainerRegistry=${{env.CONTAINER_REGISTRY}} \
          -p:ContainerRepository="${{github.repository_owner}}/${{env.CONTAINER_NAME}}" \
          -p:ContainerRepository='"${{steps.tag-creator.outputs.VERSION_TAG}};latest"' \
          -p:ContainerBaseImage='mcr.microsoft.com/dotnet/aspnet:10.0' \
          -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"' \
          -p:RuntimeIdentifiers='"linux-x64;linux-arm64"'

    - name: "🗑️ Clean up old container versions"
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{github.repository_owner}}
        package-name: "${{env.CONTAINER_NAME}}"
        package-type: 'container'
        min-versions-to-keep: 4

  update-production:
    name: "Update Production"
    needs: build_and_publish
    environment: production # has 1 minute wait timer, https://github.com/LanceMcCarthy/dvlup-blog/settings/environments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer webhook (redeploy stack)
        run: curl --fail-with-body --show-error -X POST "${{secrets.PORTAINER_WEBHOOK_URL}}"

      