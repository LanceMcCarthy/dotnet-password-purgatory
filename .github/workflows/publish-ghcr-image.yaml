name: Publish Docker Image (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - releases/*

permissions:
  contents: read
  packages: write
  id-token: write # JWT for Akeyless

env:
  CSPROJ_PATH: "src/PasswordPurgatory/PasswordPurgatory.Web/PasswordPurgatory.Web.csproj"
  CONTAINER_NAME: "passwordpurgatoryweb"
  CONTAINER_REGISTRY: 'ghcr.io'

jobs:
  publish_ghcr:
    runs-on: ubuntu-latest
    name: "Build and publish image"
    steps:
    - name: Checkout to the branch
      uses: actions/checkout@v7    

    # Using AKeyless for secrets in this demo, but you can use github Secrets instead
    - name: "🔐 Fetch secrets from AKeyless"
      id: akeyless
      uses: LanceMcCarthy/akeyless-action@v5
      with:
        access-id: 'p-4blpeo5zdfeaom'
        static-secrets: |
          {
            "/progress/DEPLOYMENT_KEY_PASSWORD_PURGATORY":"TK_DEPLOYMENT_KEY"
          }
        export-secrets-to-outputs: true
        export-secrets-to-environment: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: "🔑 Login to ghcr.io"
      run: docker login ${{env.CONTAINER_REGISTRY}} -u ${{github.actor}} -p ${{secrets.GITHUB_TOKEN}}

    - name: "🏷️ Generate versioned tag"
      id: tag-creator
      run: |
        buildDay=`date +%Y.%m.%d`
        tags="$buildDay.$GITHUB_RUN_NUMBER"
        echo "VERSION_TAG=$tags" >> $GITHUB_OUTPUT

    - name: Build and push image to ghcr.io
      run: |
        dotnet publish ${{env.CSPROJ_PATH}} \
          -t:PublishContainer \
          -p PublishProfile=DefaultContainer \
          -p ContainerRegistry=${{env.CONTAINER_REGISTRY}} \
          -p ContainerRepository="${{github.repository_owner}}/${{env.CONTAINER_NAME}}" \
          -p ContainerImageTags='"${{steps.tag-creator.outputs.VERSION_TAG}};latest"' \
          -p ContainerBaseImage='mcr.microsoft.com/dotnet/aspnet:10.0' \
          -p ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"' \
          -p RuntimeIdentifiers='"linux-x64;linux-arm64"'
      env:
        TELERIK_LICENSE: ${{steps.akeyless.outputs.TK_DEPLOYMENT_KEY}}

    - name: "🗑️ Clean up old container versions"
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{github.repository_owner}}
        package-name: "${{env.CONTAINER_NAME}}"
        package-type: 'container'
        min-versions-to-keep: 4

  update-production:
    name: "Update Production"
    needs: publish_ghcr
    environment: production # has 1 minute wait timer, https://github.com/LanceMcCarthy/dvlup-blog/settings/environments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer webhook (redeploy stack)
        run: curl --fail-with-body --show-error -X POST "${{secrets.PORTAINER_WEBHOOK_URL}}"

      